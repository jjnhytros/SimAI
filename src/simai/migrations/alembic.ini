[alembic]
file_template = %%(rev)s_%%(slug)s
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[tool.hatch.build.targets.wheel]
packages = ["src/simai"]

[tool.hatch.build.targets.wheel.force-include]
"src/simai/migrations/alembic.ini" = "simai/migrations/alembic.ini"
"src/simai/migrations/script.py.mako" = "simai/migrations/script.py.mako"
