{% extends "base.html" %}
{% block title %}Albero — {{ c.full_name }}{% endblock %}

{% block content %}
<h1 class="h3 mb-3">
    <i class="bi bi-diagram-3"></i>
    Albero genealogico di {{ c.full_name }}
</h1>
<svg id="tree-svg" style="width: 100%; height: 600px; background: #000; border-radius: 8px;"></svg>
{% endblock %}

{% block scripts %}
<script src="/static/js/d3.min.js"></script>
<script>
fetch("/api/npcs/{{ c.id }}/tree.json")
    .then(r => r.json())
    .then(data => {
        const svg = d3.select("#tree-svg");
        const width = svg.node().clientWidth;
        const height = svg.node().clientHeight;

        const g = svg.append("g").attr("transform", "translate(40,40)");

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = g.selectAll("line")
            .data(data.links)
            .enter().append("line")
            .attr("stroke", "#555")
            .attr("stroke-width", 1.5);

        const node = g.selectAll("circle")
            .data(data.nodes)
            .enter().append("circle")
            .attr("r", d => d.is_target ? 12 : 8)
            .attr("fill", d => {
                if (d.is_target) return "#0dcaf0";
                if (!d.alive) return "#6c757d";
                return d.sex === "female" ? "#d63384" : "#0d6efd";
            })
            .attr("stroke", "#fff")
            .attr("stroke-width", d => d.is_target ? 2 : 0.5);

        const labels = g.selectAll("text")
            .data(data.nodes)
            .enter().append("text")
            .attr("font-size", 11)
            .attr("fill", "#ccc")
            .attr("dx", 14)
            .attr("dy", 4)
            .text(d => d.name);

        node.call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            labels.attr("x", d => d.x).attr("y", d => d.y);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }
        function dragged(event, d) {
            d.fx = event.x; d.fy = event.y;
        }
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
        }
    });
</script>
{% endblock %}
