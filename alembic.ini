[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# File naming: NNNN_SS_slug.py
# Invocare con: alembic revision --rev-id "5000_01" -m "descrizione"
file_template = %%(rev)s_%%(slug)s
# La URL effettiva è iniettata da alembic/env.py leggendo SIMAI_DB_URL.
sqlalchemy.url = sqlite:///./simai.db

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S