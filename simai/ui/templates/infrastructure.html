{% extends "base.html" %}
{% block title %}Infrastrutture — SimAI{% endblock %}

{% block content %}
<h1 class="h3 mb-3"><i class="bi bi-signpost-2"></i> Infrastrutture</h1>

<div class="row g-3">
    <div class="col-md-3">
        <div class="card bg-black border-secondary mb-3">
            <div class="card-header">Strumenti</div>
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="infra-tool" id="tool-road"
                           value="ROAD" checked>
                    <label class="form-check-label" for="tool-road">
                        <i class="bi bi-signpost"></i> Strada
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="infra-tool" id="tool-light"
                           value="LIGHT">
                    <label class="form-check-label" for="tool-light">
                        <i class="bi bi-lightbulb"></i> Lampione
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="infra-tool" id="tool-delete"
                           value="DELETE">
                    <label class="form-check-label" for="tool-delete">
                        <i class="bi bi-eraser"></i> Elimina
                    </label>
                </div>
                <hr>
                <label class="small text-secondary mb-1">Tipo strada</label>
                <select class="form-select form-select-sm mb-2" id="road-type">
                    <option value="PATH">Path (5 Athel)</option>
                    <option value="ALLEY">Alley (10)</option>
                    <option value="STREET" selected>Street (20)</option>
                    <option value="AVENUE">Avenue (40)</option>
                </select>
                <label class="small text-secondary mb-1">Tipo lampione</label>
                <select class="form-select form-select-sm mb-2" id="light-type">
                    <option value="STANDARD" selected>Standard (30, r=3)</option>
                    <option value="GAS">Gas (50, r=4)</option>
                    <option value="ELECTRIC">Electric (80, r=5)</option>
                </select>
            </div>
        </div>

        <div class="card bg-black border-secondary mb-3">
            <div class="card-header">Vista</div>
            <div class="card-body">
                <label class="small text-secondary mb-1">
                    Bbox X: <span id="bbox-x-display">0..50</span>
                </label>
                <input type="range" class="form-range" id="bbox-x"
                       min="0" max="150" value="0" step="5">
                <label class="small text-secondary mb-1">
                    Bbox Y: <span id="bbox-y-display">0..50</span>
                </label>
                <input type="range" class="form-range" id="bbox-y"
                       min="0" max="150" value="0" step="5">
                <button class="btn btn-outline-info btn-sm w-100 mt-2"
                        id="refresh-btn">
                    <i class="bi bi-arrow-clockwise"></i> Aggiorna
                </button>
            </div>
        </div>

        <div class="card bg-black border-secondary">
            <div class="card-header">Info</div>
            <div class="card-body small">
                <div>Strade: <strong id="road-count">0</strong></div>
                <div>Lampioni: <strong id="light-count">0</strong></div>
                <hr>
                <div id="status" class="text-secondary">Pronto.</div>
            </div>
        </div>
    </div>

    <div class="col-md-9">
        <div class="card bg-black border-secondary">
            <div class="card-body p-2">
                <canvas id="infra-canvas"
                        style="width: 100%; height: 600px; background: #0a0a0a; cursor: crosshair;"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const INFRA_API = {
    layout: "/api/infrastructure/layout.json",
    road: "/api/infrastructure/road",
    light: "/api/infrastructure/light",
    coverage: "/api/infrastructure/coverage.json",
};

const state = {
    bbox_x0: 0, bbox_y0: 0,
    bbox_w: 50, bbox_h: 50,
    roads: [],
    lights: [],
    tool: "ROAD",
    cell_size: 12,
    offset_x: 0, offset_y: 0,
};

const canvas = document.getElementById("infra-canvas");
const ctx = canvas.getContext("2d");

// ---------- Rendering ----------

function resize() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    const pad = 20;
    const cw = (rect.width - pad * 2) / state.bbox_w;
    const ch = (rect.height - pad * 2) / state.bbox_h;
    state.cell_size = Math.max(4, Math.floor(Math.min(cw, ch)));
    state.offset_x = (rect.width - state.cell_size * state.bbox_w) / 2;
    state.offset_y = (rect.height - state.cell_size * state.bbox_h) / 2;
    draw();
}

function draw() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    const cs = state.cell_size;
    const ox = state.offset_x;
    const oy = state.offset_y;

    // Sfondo
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(ox, oy, cs * state.bbox_w, cs * state.bbox_h);

    // Griglia
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 1;
    for (let x = 0; x <= state.bbox_w; x++) {
        ctx.beginPath();
        ctx.moveTo(ox + x * cs, oy);
        ctx.lineTo(ox + x * cs, oy + state.bbox_h * cs);
        ctx.stroke();
    }
    for (let y = 0; y <= state.bbox_h; y++) {
        ctx.beginPath();
        ctx.moveTo(ox, oy + y * cs);
        ctx.lineTo(ox + state.bbox_w * cs, oy + y * cs);
        ctx.stroke();
    }

    // Strade
    for (const r of state.roads) {
        const px = ox + (r.x - state.bbox_x0) * cs;
        const py = oy + (r.y - state.bbox_y0) * cs;
        if (px < ox - cs || py < oy - cs ||
            px > ox + state.bbox_w * cs || py > oy + state.bbox_h * cs) continue;

        const colors = {
            PATH: "#5a4a3a",
            ALLEY: "#7a6a4a",
            STREET: "#8a8a8a",
            AVENUE: "#a0a0a0",
        };
        const base = colors[r.road_type] || "#808080";
        const cond = Math.max(0.2, r.condition);
        ctx.fillStyle = base;
        ctx.globalAlpha = cond;
        ctx.fillRect(px, py, cs, cs);
        ctx.globalAlpha = 1.0;
    }

    // Lampioni
    for (const l of state.lights) {
        const px = ox + (l.x - state.bbox_x0) * cs + cs / 2;
        const py = oy + (l.y - state.bbox_y0) * cs + cs / 2;
        if (px < ox - 20 || py < oy - 20 ||
            px > ox + state.bbox_w * cs + 20 ||
            py > oy + state.bbox_h * cs + 20) continue;

        // Raggio (cerchio translucido)
        if (l.is_active) {
            ctx.fillStyle = "rgba(255, 220, 100, 0.08)";
            ctx.beginPath();
            ctx.arc(px, py, l.radius * cs, 0, Math.PI * 2);
            ctx.fill();
        }
        // Punto
        ctx.fillStyle = l.is_active ? "#ffc107" : "#6c757d";
        ctx.beginPath();
        ctx.arc(px, py, Math.max(2, cs / 4), 0, Math.PI * 2);
        ctx.fill();
    }

    document.getElementById("road-count").textContent = String(state.roads.length);
    document.getElementById("light-count").textContent = String(state.lights.length);
}

// ---------- Mouse → cell ----------

function cellAt(ev) {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left - state.offset_x;
    const my = ev.clientY - rect.top - state.offset_y;
    const cx = Math.floor(mx / state.cell_size);
    const cy = Math.floor(my / state.cell_size);
    if (cx < 0 || cx >= state.bbox_w || cy < 0 || cy >= state.bbox_h) return null;
    return {
        x: state.bbox_x0 + cx,
        y: state.bbox_y0 + cy,
    };
}

function findRoad(x, y) {
    return state.roads.find(r => r.x === x && r.y === y);
}
function findLight(x, y) {
    return state.lights.find(l => l.x === x && l.y === y);
}

// ---------- Apply tool ----------

async function applyTool(cell) {
    if (!cell) return;
    const { x, y } = cell;

    if (state.tool === "ROAD") {
        const existing = findRoad(x, y);
        if (existing) {
            setStatus(`Già una strada ${existing.road_type} qui`, "warning");
            return;
        }
        const roadType = document.getElementById("road-type").value;
        const r = await fetch(INFRA_API.road, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ x, y, road_type: roadType }),
        });
        if (!r.ok) {
            const e = await r.json();
            setStatus("Errore: " + (e.detail || r.statusText), "danger");
            return;
        }
        setStatus(`Strada ${roadType} posata`, "success");
        return;
    }

    if (state.tool === "LIGHT") {
        const existing = findLight(x, y);
        if (existing) {
            setStatus("Lampione già presente", "warning");
            return;
        }
        const lightType = document.getElementById("light-type").value;
        const r = await fetch(INFRA_API.light, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ x, y, light_type: lightType }),
        });
        if (!r.ok) {
            const e = await r.json();
            setStatus("Errore: " + (e.detail || r.statusText), "danger");
            return;
        }
        setStatus(`Lampione ${lightType} posato`, "success");
        return;
    }

    if (state.tool === "DELETE") {
        // Prova lampione prima, poi strada
        if (findLight(x, y)) {
            await fetch(`/api/infrastructure/light/${x}/${y}`, { method: "DELETE" });
            setStatus("Lampione rimosso", "success");
            return;
        }
        if (findRoad(x, y)) {
            await fetch(`/api/infrastructure/road/${x}/${y}`, { method: "DELETE" });
            setStatus("Strada rimossa", "success");
            return;
        }
        setStatus("Niente da rimuovere qui", "secondary");
    }
}

function setStatus(text, level) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = "text-" + (level || "secondary");
}

// ---------- Data ----------

async function refresh() {
    const x0 = state.bbox_x0;
    const y0 = state.bbox_y0;
    const x1 = x0 + state.bbox_w - 1;
    const y1 = y0 + state.bbox_h - 1;
    const url = `${INFRA_API.layout}?x0=${x0}&y0=${y0}&x1=${x1}&y1=${y1}`;
    const r = await fetch(url);
    const data = await r.json();
    state.roads = data.roads || [];
    state.lights = data.lights || [];
    resize();
}

// ---------- Events ----------

canvas.addEventListener("click", async (ev) => {
    const cell = cellAt(ev);
    await applyTool(cell);
    await refresh();
});

for (const r of document.querySelectorAll("input[name=infra-tool]")) {
    r.addEventListener("change", () => { state.tool = r.value; });
}

document.getElementById("bbox-x").addEventListener("input", (ev) => {
    state.bbox_x0 = parseInt(ev.target.value, 10);
    document.getElementById("bbox-x-display").textContent =
        `${state.bbox_x0}..${state.bbox_x0 + state.bbox_w}`;
    refresh();
});

document.getElementById("bbox-y").addEventListener("input", (ev) => {
    state.bbox_y0 = parseInt(ev.target.value, 10);
    document.getElementById("bbox-y-display").textContent =
        `${state.bbox_y0}..${state.bbox_y0 + state.bbox_h}`;
    refresh();
});

document.getElementById("refresh-btn").addEventListener("click", refresh);

window.addEventListener("resize", resize);

// Init
refresh();
</script>
{% endblock %}
