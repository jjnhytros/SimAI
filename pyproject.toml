[project]
name = "simai"
version = "0.1.0.dev0"
description = "SimAI — Simulazione di vita ad agenti ambientata nel mondo di Anthalys"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "SimAI Project" }]
keywords = ["simulation", "agents", "anthalys", "simai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
save = [
    "zstandard>=0.22",
    "cryptography>=42",
]
ui = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
simai = "simai.cli.app:app"

[project.urls]
Homepage = "https://github.com/simai-project/simai"
Documentation = "https://github.com/simai-project/simai/docs"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.13",
    "pyright>=1.1.390",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simai"]

[tool.hatch.build.targets.wheel.force-include]
"simai/py.typed" = "simai/py.typed"

[tool.hatch.build.targets.sdist.force-include]
"simai/py.typed" = "simai/py.typed"

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["simai"]
extend-exclude = [
    "alembic/versions",
    ".venv",
    "build",
    "dist",
    "zzzDocs",
    "**/*.md",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP",
    "B", "C4", "SIM", "TID", "RUF",
]
ignore = [
    "E501",     # line-too-long (gestito da ruff format)
    "RUF001",   # ambiguous unicode in strings
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["simai"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"simai/__main__.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# Typer e FastAPI richiedono chiamate a funzione nei default (idiomatico).
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# NON formattare code block dentro markdown
docstring-code-format = false

# --- mypy ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["alembic.*", "zstandard.*", "zstandard", "cryptography.*", "cryptography"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pyright ---
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["simai"]
exclude = ["**/__pycache__", ".venv", "alembic/versions"]
reportMissingTypeStubs = false