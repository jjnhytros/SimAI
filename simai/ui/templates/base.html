<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SimAI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/simai.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-diagram-3-fill text-info"></i>
            SimAI
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/npcs"><i class="bi bi-people-fill"></i> NPC</a></li>
                <li class="nav-item"><a class="nav-link" href="/world"><i class="bi bi-geo-alt-fill"></i> World</a></li>
                <li class="nav-item"><a class="nav-link" href="/economy"><i class="bi bi-coin"></i> Economy</a></li>
                <li class="nav-item"><a class="nav-link" href="/economy/aion"><i class="bi bi-shop-window"></i> AION</a></li>
                <li class="nav-item"><a class="nav-link" href="/live"><i class="bi bi-activity"></i> Live</a></li>
                <li class="nav-item"><a class="nav-link" href="/city"><i class="bi bi-building"></i> Città</a></li>
                <li class="nav-item"><a class="nav-link" href="/world/infrastructure"><i class="bi bi-signpost-2"></i> Infra</a></li>
                <li class="nav-item"><a class="nav-link" href="/transport"><i class="bi bi-bus-front"></i> Trasporti</a></li>
                <li class="nav-item"><a class="nav-link" href="/transport/transits"><i class="bi bi-signpost-split"></i> Transiti</a></li>
            </ul>
            <span class="navbar-text text-secondary small">v{{ simai_version }}</span>
        </div>
    </div>
</nav>

<main class="container-fluid py-4">
    {% block content %}{% endblock %}
</main>

<footer class="container-fluid py-3 text-secondary small border-top border-secondary mt-4">
    SimAI UI · read-only · {{ simai_version }}
</footer>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/htmx.min.js"></script>
<script src="/static/js/alpine.min.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
